<!-- CampusFix Reusable Modal Template -->
<div class="modal-overlay" id="demo-modal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 class="modal-title">Modal Header</h3>
      <button class="modal-close-btn" onclick="UTILS.closeModal('demo-modal')">
        <img src="../assets/icons/close.svg" class="icon icon-sm" alt="Close">
      </button>
    </div>
    <div class="modal-body">
      <p>Modal content goes here.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="UTILS.closeModal('demo-modal')">Cancel</button>
      <button class="btn btn-primary">Confirm</button>
    </div>
  </div>
</div>
