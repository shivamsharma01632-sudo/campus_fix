<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLA Monitor & Compliance — CampusFix Admin</title>
  <meta name="description" content="Monitor active SLA countdowns, breached repair thresholds, and escalation rules.">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/cards.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <!-- Role Guard: Require ADMIN session before displaying protected content -->
  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    AUTH.requireRole('ADMIN');
  </script>
</head>
<body>
  <div class="campusfix-page" style="max-width: 1360px;">
    <main class="campusfix-card-canvas">
      <nav class="navbar" style="padding-bottom: 16px;">
        <a href="../../index.html" class="brand-wrapper">
          <img src="../../assets/icons/logo.svg" alt="CampusFix Logo" class="brand-logo-img">
          <span class="brand-title">CampusFix</span>
        </a>

        <div class="navbar-center" style="display: flex;">
          <a href="dashboard.html" class="btn btn-secondary" style="font-size: 13px; padding: 6px 18px; border-radius: var(--radius-pill);">
            Admin Dashboard
          </a>
        </div>

        <div class="navbar-right">
          <div class="user-badge">
            <span class="user-badge-name" id="nav-user-name">Chief Admin</span>
            <span class="user-badge-role" id="nav-user-role">Administrator</span>
          </div>
          <a href="#" class="nav-signout-btn">
            <img src="../../assets/icons/signout.svg" class="icon icon-sm" alt="">
            <span>Sign out</span>
          </a>
        </div>
      </nav>

      <div style="display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px;">
        <a href="dashboard.html" class="nav-pill-btn">Overview</a>
        <a href="tickets.html" class="nav-pill-btn">Tickets</a>
        <a href="technicians.html" class="nav-pill-btn">Technicians</a>
        <a href="departments.html" class="nav-pill-btn">Departments</a>
        <a href="assets.html" class="nav-pill-btn">Assets & IoT</a>
        <a href="analytics.html" class="nav-pill-btn">Analytics</a>
        <a href="chronic-issues.html" class="nav-pill-btn">Chronic Issues</a>
        <a href="sla-monitor.html" class="nav-pill-btn active">SLA Monitor</a>
        <a href="settings.html" class="nav-pill-btn">Settings</a>
      </div>

      <div class="dashboard-header">
        <div>
          <h1 class="page-title">SLA Compliance Monitor</h1>
        </div>
        <div class="live-indicator">
          <span class="pulse-dot"></span>
          <span>SLA Heartbeat Live</span>
        </div>
      </div>

      <!-- Overdue Incidents Alert Table -->
      <div class="table-container" style="margin-top: 20px;">
        <table class="data-table">
          <thead>
            <tr>
              <th>INCIDENT</th>
              <th>FACILITY ISSUE</th>
              <th>LOCATION</th>
              <th>DEPARTMENT</th>
              <th>TECH IN-CHARGE</th>
              <th>SLA OVERDUE COUNTDOWN</th>
              <th>ESCALATE</th>
            </tr>
          </thead>
          <tbody id="sla-tbody">
            <!-- Rendered by js/admin/sla-monitor.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/admin/sla-monitor.js"></script>
</body>
</html>
