<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facility Departments — CampusFix Admin</title>
  <meta name="description" content="Manage campus maintenance departments, leadership, and operational SLA targets.">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/cards.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <!-- Role Guard: Require ADMIN session before displaying protected content -->
  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    AUTH.requireRole('ADMIN');
  </script>
</head>
<body>
  <div class="campusfix-page" style="max-width: 1360px;">
    <main class="campusfix-card-canvas">
      <nav class="navbar" style="padding-bottom: 16px;">
        <a href="../../index.html" class="brand-wrapper">
          <img src="../../assets/icons/logo.svg" alt="CampusFix Logo" class="brand-logo-img">
          <span class="brand-title">CampusFix</span>
        </a>

        <div class="navbar-center" style="display: flex;">
          <a href="dashboard.html" class="btn btn-secondary" style="font-size: 13px; padding: 6px 18px; border-radius: var(--radius-pill);">
            Admin Dashboard
          </a>
        </div>

        <div class="navbar-right">
          <div class="user-badge">
            <span class="user-badge-name" id="nav-user-name">Chief Admin</span>
            <span class="user-badge-role" id="nav-user-role">Administrator</span>
          </div>
          <a href="#" class="nav-signout-btn">
            <img src="../../assets/icons/signout.svg" class="icon icon-sm" alt="">
            <span>Sign out</span>
          </a>
        </div>
      </nav>

      <div style="display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px;">
        <a href="dashboard.html" class="nav-pill-btn">Overview</a>
        <a href="tickets.html" class="nav-pill-btn">Tickets</a>
        <a href="technicians.html" class="nav-pill-btn">Technicians</a>
        <a href="departments.html" class="nav-pill-btn active">Departments</a>
        <a href="assets.html" class="nav-pill-btn">Assets & IoT</a>
        <a href="analytics.html" class="nav-pill-btn">Analytics</a>
        <a href="chronic-issues.html" class="nav-pill-btn">Chronic Issues</a>
        <a href="sla-monitor.html" class="nav-pill-btn">SLA Monitor</a>
        <a href="settings.html" class="nav-pill-btn">Settings</a>
      </div>

      <div class="dashboard-header">
        <div>
          <h1 class="page-title">Maintenance Departments</h1>
        </div>
      </div>

      <div class="tickets-grid" id="departments-grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); margin-top: 24px;">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('departments-grid');
      const depts = await API.getDepartments();

      container.innerHTML = depts.map(d => `
        <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
              <h3 style="font-size: 18px; font-weight: 800; color: var(--color-text-heading);">${d.name}</h3>
              <span class="badge badge-tag">${d.id}</span>
            </div>

            <div style="font-size: 13.5px; color: var(--color-text-muted); margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px;">
              <div>Department Head: <strong>${d.head}</strong></div>
              <div>Staff On-Duty: <strong>${d.staffCount} Technicians</strong></div>
              <div>Open Dispatches: <strong>${d.openTickets}</strong></div>
            </div>

            <div class="triage-metric-row">
              <span class="triage-metric-label">SLA Compliance:</span>
              <span class="badge badge-resolved" style="font-size: 13px;">${d.slaCompliance}</span>
            </div>
          </div>

          <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--color-border); display: flex; justify-content: space-between;">
            <a href="tickets.html?dept=${encodeURIComponent(d.name)}" class="btn btn-secondary" style="font-size: 13px;">
              View Tickets &rarr;
            </a>
            <button class="btn btn-outline" style="font-size: 13px;" onclick="UTILS.showToast('Department configuration updated', 'info')">
              Configure
            </button>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
