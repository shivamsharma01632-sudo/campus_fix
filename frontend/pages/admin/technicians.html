<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technician Roster & Utilization — CampusFix Admin</title>
  <meta name="description" content="Manage facility technician staff, workload limits, and active assignments.">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/cards.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <!-- Role Guard: Require ADMIN session before displaying protected content -->
  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    AUTH.requireRole('ADMIN');
  </script>
</head>
<body>
  <div class="campusfix-page" style="max-width: 1360px;">
    <main class="campusfix-card-canvas">
      <!-- Navbar -->
      <nav class="navbar" style="padding-bottom: 16px;">
        <a href="../../index.html" class="brand-wrapper">
          <img src="../../assets/icons/logo.svg" alt="CampusFix Logo" class="brand-logo-img">
          <span class="brand-title">CampusFix</span>
        </a>

        <div class="navbar-center" style="display: flex;">
          <a href="dashboard.html" class="btn btn-secondary" style="font-size: 13px; padding: 6px 18px; border-radius: var(--radius-pill);">
            Admin Dashboard
          </a>
        </div>

        <div class="navbar-right">
          <div class="user-badge">
            <span class="user-badge-name" id="nav-user-name">Chief Admin</span>
            <span class="user-badge-role" id="nav-user-role">Administrator</span>
          </div>
          <a href="#" class="nav-signout-btn">
            <img src="../../assets/icons/signout.svg" class="icon icon-sm" alt="">
            <span>Sign out</span>
          </a>
        </div>
      </nav>

      <!-- Subnav Pills -->
      <div style="display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px;">
        <a href="dashboard.html" class="nav-pill-btn">Overview</a>
        <a href="tickets.html" class="nav-pill-btn">Tickets</a>
        <a href="technicians.html" class="nav-pill-btn active">Technicians</a>
        <a href="departments.html" class="nav-pill-btn">Departments</a>
        <a href="assets.html" class="nav-pill-btn">Assets & IoT</a>
        <a href="analytics.html" class="nav-pill-btn">Analytics</a>
        <a href="chronic-issues.html" class="nav-pill-btn">Chronic Issues</a>
        <a href="sla-monitor.html" class="nav-pill-btn">SLA Monitor</a>
        <a href="settings.html" class="nav-pill-btn">Settings</a>
      </div>

      <div class="dashboard-header">
        <div>
          <h1 class="page-title">Technician Workload &amp; Roster</h1>
        </div>
        <button class="btn btn-primary" onclick="UTILS.openModal('add-tech-modal')">
          <img src="../../assets/icons/plus.svg" class="icon icon-sm" style="filter: brightness(0) invert(1);" alt="">
          <span>Add Technician</span>
        </button>
      </div>

      <!-- Technicians Cards Grid -->
      <div class="tickets-grid" id="technicians-grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); margin-top: 24px;">
        <!-- Rendered by js/admin/technicians.js -->
      </div>

      <!-- Add Technician Modal -->
      <div class="modal-overlay" id="add-tech-modal">
        <div class="modal-card">
          <div class="modal-header">
            <h3 class="modal-title">Add Technician to Roster</h3>
            <button class="modal-close-btn" onclick="UTILS.closeModal('add-tech-modal')">
              <img src="../../assets/icons/close.svg" class="icon icon-sm" alt="x">
            </button>
          </div>
          <form id="add-tech-form">
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="new-tech-name" class="form-input" placeholder="e.g. Liam O'Connor" required>
              </div>

              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="new-tech-email" class="form-input" placeholder="l.oconnor@campus.edu" required>
              </div>

              <div class="form-group">
                <label class="form-label">Department</label>
                <select id="new-tech-dept" class="form-select">
                  <option value="Electrical Maintenance">Electrical Maintenance</option>
                  <option value="Civil & Plumbing">Civil & Plumbing</option>
                  <option value="HVAC Operations">HVAC Operations</option>
                  <option value="Campus IT & Networks">Campus IT & Networks</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label">Max Active Tasks Limit</label>
                <input type="number" id="new-tech-limit" class="form-input" value="5" min="1" max="10">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" onclick="UTILS.closeModal('add-tech-modal')">Cancel</button>
              <button type="submit" class="btn btn-primary">Add to Roster</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/admin/technicians.js"></script>
</body>
</html>
