<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CampusFix</title>
  <meta name="description" content="Register an account on CampusFix to submit and track facility maintenance requests.">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="campusfix-page">
    <main class="campusfix-card-canvas" style="align-items: center; justify-content: space-between;">
      <header class="navbar">
        <a href="../index.html" class="brand-wrapper">
          <img src="../assets/icons/logo.svg" alt="CampusFix Logo" class="brand-logo-img">
          <span class="brand-title">CampusFix</span>
        </a>

        <div class="navbar-right">
          <a href="login.html" class="btn btn-outline">
            <span>Sign in</span>
          </a>
        </div>
      </header>

      <section style="width: 100%; max-width: 480px; margin: 24px auto;">
        <div class="card" style="border-radius: var(--radius-xl); padding: 36px 32px; box-shadow: var(--shadow-card-hover);">
          <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 6px; color: var(--color-text-heading);">Create an account</h1>
          <p style="font-size: 13.5px; color: var(--color-text-muted); margin-bottom: 24px;">
            Join CampusFix to report issues and access your facility portal.
          </p>

          <form id="register-form">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="reg-name" class="form-input" placeholder="e.g. Alex Mercer" required>
            </div>

            <div class="form-group">
              <label class="form-label">College Email</label>
              <input type="email" id="reg-email" class="form-input" placeholder="student@campus.edu" required>
            </div>

            <div class="form-group">
              <label class="form-label">Role</label>
              <select id="reg-role" class="form-select">
                <option value="student">Student / Resident</option>
                <option value="technician">Technician / Maintenance Crew</option>
                <option value="admin">Administrator / Facility Desk</option>
              </select>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
              <label class="form-label">Password</label>
              <input type="password" id="reg-password" class="form-input tinted" placeholder="Create a password" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary w-full" style="height: 48px; font-size: 15px; border-radius: var(--radius-pill); font-weight: 700;">
              Create Account
            </button>
          </form>

          <div style="text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--color-text-muted);">
            Already have an account? <a href="login.html" style="color: var(--color-brand-purple); font-weight: 600; text-decoration: underline;">Sign in</a>
          </div>
        </div>
      </section>

      <footer style="text-align: center; color: var(--color-text-subtle); font-size: 13px; padding-top: 10px;">
        CampusFix &bull; AI-Powered Campus Facility Management
      </footer>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const role = document.getElementById('reg-role').value;
      const pass = document.getElementById('reg-password').value;

      const user = AUTH.register(name, email, pass, role);
      UTILS.showToast(`Account created for ${name}!`, 'success');

      setTimeout(() => {
        if (role === 'student') window.location.href = 'student/dashboard.html';
        else if (role === 'technician') window.location.href = 'technician/dashboard.html';
        else window.location.href = 'admin/dashboard.html';
      }, 500);
    });
  </script>
</body>
</html>
