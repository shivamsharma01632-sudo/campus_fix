<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tickets — CampusFix</title>
  <meta name="description" content="View and manage all your submitted campus maintenance tickets.">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/cards.css">
  <link rel="stylesheet" href="../../css/tickets.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <!-- Role Guard: Require STUDENT session before displaying protected content -->
  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    AUTH.requireRole('STUDENT');
  </script>
</head>
<body>
  <div class="campusfix-page">
    <main class="campusfix-card-canvas">
      <!-- Navbar -->
      <nav class="navbar">
        <a href="../../index.html" class="brand-wrapper">
          <img src="../../assets/icons/logo.svg" alt="CampusFix Logo" class="brand-logo-img">
          <span class="brand-title">CampusFix</span>
        </a>

        <div class="navbar-center">
          <a href="dashboard.html" class="nav-pill-btn">Report</a>
          <a href="my-tickets.html" class="nav-pill-btn active">My tickets</a>
          <a href="profile.html" class="nav-pill-btn">Profile</a>
        </div>

        <div class="navbar-right">
          <div class="user-badge">
            <span class="user-badge-name" id="nav-user-name">Test12345</span>
            <span class="user-badge-role" id="nav-user-role">Student</span>
          </div>
          <a href="#" class="nav-signout-btn">
            <img src="../../assets/icons/signout.svg" class="icon icon-sm" alt="">
            <span>Sign out</span>
          </a>
        </div>
      </nav>

      <div class="dashboard-header">
        <div>
          <h1 class="page-title">My Tickets</h1>
        </div>
        <a href="dashboard.html" class="btn btn-primary">
          <img src="../../assets/icons/plus.svg" class="icon icon-sm" style="filter: brightness(0) invert(1);" alt="">
          <span>New Report</span>
        </a>
      </div>

      <!-- Filter Toolbar -->
      <div class="filter-toolbar">
        <div class="search-input-wrapper">
          <img src="../../assets/icons/search.svg" class="icon icon-sm" alt="">
          <input type="text" id="ticket-search-input" class="form-input" placeholder="Search by title, room, or ticket ID...">
        </div>

        <div class="segmented-control" id="status-filter-pills">
          <button class="seg-btn active" data-status="ALL">All</button>
          <button class="seg-btn" data-status="Open">Open</button>
          <button class="seg-btn" data-status="In Progress">In Progress</button>
          <button class="seg-btn" data-status="Resolved">Resolved</button>
        </div>
      </div>

      <!-- Tickets Grid -->
      <div class="tickets-grid" id="my-tickets-container">
        <!-- Rendered by js/student/my-tickets.js -->
      </div>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/student/my-tickets.js"></script>
</body>
</html>
